name: CI

# P3-07: at minimum a build/typecheck step on every push/PR. No lint config
# exists in this repo yet (no .eslintrc/eslint.config.*), so this doesn't
# add a lint step -- adding ESLint from scratch is its own task, not
# something to fold in silently here.
# F-01: package.json's test script is no longer a placeholder -- P4-06 added
# real vitest coverage for ratings/series/collections/watchlist, so this now
# runs it. Supabase and auth are mocked in those tests, so no DB or secrets
# are needed here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / build
        run: npm run build

      - name: Run tests
        run: npm test
